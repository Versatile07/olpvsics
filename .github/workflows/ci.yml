name: CI

on:
  push:
    branches: [main, fix/complete-features]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests on Ubuntu (Linux) ──
  backend-tests:
    name: Backend Tests (Linux)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: olpvsics_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Ensure uploads directory exists
        run: mkdir -p backend/uploads

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          PORT: 5000
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: olpvsics_test
          UPLOAD_DIR: ./uploads

  # ── Frontend lint + build on Ubuntu ──
  frontend-build:
    name: Frontend Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
